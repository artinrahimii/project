syntax = "proto3";

package whitep.protocol.v1;

option csharp_namespace = "WhiteP.Shared.Contracts.V1";
option java_package = "org.whitep.shared.contracts.v1";
option java_multiple_files = true;

enum HostRuntimeState {
  HOST_RUNTIME_STATE_UNSPECIFIED = 0;
  HOST_RUNTIME_STATE_STARTING = 1;
  HOST_RUNTIME_STATE_READY = 2;
  HOST_RUNTIME_STATE_BUSY = 3;
  HOST_RUNTIME_STATE_STOPPING = 4;
  HOST_RUNTIME_STATE_UNAVAILABLE = 5;
}

enum InferenceOutcome {
  INFERENCE_OUTCOME_UNSPECIFIED = 0;
  INFERENCE_OUTCOME_SUCCEEDED = 1;
  INFERENCE_OUTCOME_FAILED = 2;
  INFERENCE_OUTCOME_CANCELLED = 3;
  INFERENCE_OUTCOME_TIMED_OUT = 4;
  INFERENCE_OUTCOME_REJECTED = 5;
}

enum ProtocolErrorCode {
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  PROTOCOL_ERROR_CODE_INVALID_MESSAGE = 1;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_VERSION = 2;
  PROTOCOL_ERROR_CODE_UNSUPPORTED_MODEL = 3;
  PROTOCOL_ERROR_CODE_HOST_BUSY = 4;
  PROTOCOL_ERROR_CODE_REQUEST_EXPIRED = 5;
  PROTOCOL_ERROR_CODE_RESOURCE_LIMIT = 6;
  PROTOCOL_ERROR_CODE_INTERNAL = 7;
}

message ModelCapability {
  string model_id = 1;
  string display_name = 2;
  uint64 max_context_tokens = 3;
  uint64 max_output_tokens = 4;
  bool supports_streaming = 5;
}

message HostCapabilities {
  string ephemeral_host_id = 1;
  string protocol_version = 2;
  repeated ModelCapability models = 3;
  uint32 max_concurrent_requests = 4;
  uint64 max_context_capsule_bytes = 5;
  uint64 max_prompt_bytes = 6;
}

message InferenceRequest {
  string request_id = 1;
  string attempt_id = 2;
  string model_id = 3;
  string prompt = 4;
  uint64 deadline_unix_ms = 5;
  uint32 max_output_tokens = 6;
  // Optional bounded context capsule; transport implementations must enforce the negotiated byte limit.
  bytes context_capsule = 7;
}

message InferenceResponse {
  string request_id = 1;
  string attempt_id = 2;
  string ephemeral_host_id = 3;
  InferenceOutcome outcome = 4;
  string output_text = 5;
  uint64 completed_at_unix_ms = 6;
  string model_id = 7;
  // Safe, user-displayable error detail; empty when outcome is successful.
  string error_message = 8;
}

message CancelRequest {
  string request_id = 1;
  string attempt_id = 2;
  string reason = 3;
}

message HostStatusRequest {
  string ephemeral_host_id = 1;
}

message HostStatus {
  string ephemeral_host_id = 1;
  HostRuntimeState state = 2;
  uint32 active_requests = 3;
  uint64 observed_at_unix_ms = 4;
  repeated ModelCapability models = 5;
}

message ProtocolError {
  ProtocolErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  bool retryable = 4;
}
