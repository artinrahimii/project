name: White-P product build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows-host:
    name: Build Windows WPF host
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build host
        run: dotnet build src/Host.Windows/WhiteP.Host.Windows.csproj --configuration Release
  android-client:
    name: Build Android client APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Build debug APK
        working-directory: src/Client.Android
        run: gradle --no-daemon assembleDebug
