name: White-P product build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows-host:
    name: Build Windows WPF host
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate shared brand assets from the canonical SVG and palette
        run: python tools/generate_brand_assets.py
      - name: Install Inno Setup 6 compiler
        shell: pwsh
        run: |
          $programFiles = [Environment]::GetFolderPath("ProgramFilesX86")
          $iscc = Join-Path $programFiles "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            choco install innosetup --version=6.7.1 --yes --no-progress
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup 6 ISCC compiler was not installed."
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test sample model license notice
        run: python -m unittest discover -s tests -p test_generate_model_license_notice.py -v
      - name: Test dependency license inventory
        run: python -m unittest discover -s tests -p test_generate_dependency_licenses.py -v
      - name: Restore Windows solution from clean checkout
        run: dotnet restore WhiteP.sln
      - name: Clean Windows solution outputs
        run: dotnet clean WhiteP.sln --configuration Release
      - name: Verify C# formatting
        run: dotnet format whitespace WhiteP.sln --verify-no-changes
      - name: Build host from clean outputs
        run: dotnet build WhiteP.sln --configuration Release --no-incremental
      - name: Publish Windows host from clean checkout
        run: dotnet publish src/Host.Windows/WhiteP.Host.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/windows-host
      - name: Verify Windows publish output
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $PWD "artifacts/windows-host"
          $publishExecutable = Join-Path $publishDirectory "WhiteP.Host.Windows.exe"
          if (-not (Test-Path -LiteralPath $publishExecutable -PathType Leaf)) {
            throw "Windows publish output is missing the host executable: $publishExecutable"
          }
          $publishedFiles = Get-ChildItem -LiteralPath $publishDirectory -File -Recurse
          if (-not $publishedFiles) {
            throw "Windows publish output contains no files."
          }
          Write-Host "PASS: published $($publishedFiles.Count) Windows host files from the clean checkout."
      - name: Verify generated Protobuf C# sources
        shell: pwsh
        run: |
          $generatedRoot = "src/Shared.Contracts/obj/Release"
          $generated = Get-ChildItem $generatedRoot -Recurse -File -Filter "*.cs" -ErrorAction SilentlyContinue |
            Where-Object { Select-String -Path $_.FullName -Pattern "Generated by the protocol buffer compiler" -Quiet }
          if (-not $generated) {
            throw "No generated Protobuf C# source was found under $generatedRoot."
          }
          Write-Host "Verified generated C# source: $($generated[0].FullName)"
      - name: Smoke test WPF application startup
        shell: pwsh
        run: |
          $hostExecutable = Join-Path $PWD "src/Host.Windows/bin/Release/net10.0-windows/WhiteP.Host.Windows.exe"
          if (-not (Test-Path -LiteralPath $hostExecutable)) {
            throw "WPF host executable was not produced: $hostExecutable"
          }
          $hostDirectory = Split-Path -Parent $hostExecutable
          $env:WHITEP_BRAND_REVIEW_SCREENSHOT = Join-Path $PWD "artifacts/brand-review/windows-host.png"
          $process = Start-Process -FilePath $hostExecutable -ArgumentList "--smoke-test" -WorkingDirectory $hostDirectory -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            $process.WaitForExit()
            throw "WPF startup smoke test exceeded the 30-second limit."
          }
          if ($process.ExitCode -ne 0) {
            throw "WPF startup smoke test failed with exit code $($process.ExitCode)."
          }
          $screenshot = Get-Item -LiteralPath $env:WHITEP_BRAND_REVIEW_SCREENSHOT -ErrorAction Stop
          if ($screenshot.Length -lt 1024) { throw "WPF brand review screenshot is unexpectedly small." }
          $reviewDirectory = Join-Path $PWD "artifacts/brand-review/windows"
          New-Item -ItemType Directory -Path $reviewDirectory -Force | Out-Null
          Copy-Item -LiteralPath $env:WHITEP_BRAND_REVIEW_SCREENSHOT -Destination (Join-Path $reviewDirectory "wpf-main-window.png")
          Copy-Item -LiteralPath "src/Host.Windows/Assets/WhiteP.ico" -Destination (Join-Path $reviewDirectory "WhiteP.ico")
          & ./tools/capture_windows_brand_review.ps1 -HostExecutable $hostExecutable -OutputDirectory $reviewDirectory
          Write-Host "PASS: WPF startup, window icon, and native taskbar icon were captured."
      - name: Upload Windows brand review screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whitep-brand-review-windows
          path: artifacts/brand-review/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Verify agent-tool process restrictions on Windows
        run: dotnet run --project tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release -- --test-agent-tool-process-executor
      - name: Verify agent-tool policy rejection on Windows
        run: dotnet run --project tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release -- --test-agent-tool-policy-rejections
      - name: Verify agent-tool backend/model capability gate on Windows
        run: dotnet run --project tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release -- --test-agent-tool-capability
      - name: Verify user-scoped DPAPI host identity and peer trust storage on Windows
        run: dotnet run --project tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release -- --test-host-identity-store
      - name: Build and acceptance-test Windows installer
        shell: pwsh
        run: ./tools/build_windows_installer.ps1 -Version 0.1.0 -Publisher "Artin Rahimi" -IsccPath "$env:ISCC_PATH"
      - name: Upload Windows installer and dependency notices
        uses: actions/upload-artifact@v4
        with:
          name: whitep-windows-installer
          path: |
            artifacts/releases/WhiteP-Setup-0.1.0-win-x64.exe
            artifacts/windows-installer/licenses/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows host build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whitep-windows-host
          path: src/Host.Windows/bin/Release/net10.0-windows/
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows publish output
        uses: actions/upload-artifact@v4
        with:
          name: whitep-windows-publish
          path: artifacts/windows-host/
          if-no-files-found: error
          retention-days: 30
  android-client:
    name: Build Android client APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate shared brand assets from the canonical SVG and palette
        run: python tools/generate_brand_assets.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
      - name: Install Android build packages
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install MsQuic runtime for Android/.NET peer interoperability
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          rm /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install --yes libmsquic
      - name: Clean .NET peer interoperability fixture outputs
        run: dotnet clean tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release
      - name: Build Windows .NET peer interoperability fixture
        run: dotnet build tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release --no-incremental
      - name: Clean Android outputs
        working-directory: src/Client.Android
        run: gradle --no-daemon clean
      - name: Verify Kotlin formatting and lint
        working-directory: src/Client.Android
        run: gradle --no-daemon ktlintCheck
      - name: Build debug APK from clean outputs
        working-directory: src/Client.Android
        run: gradle --no-daemon assembleDebug --no-build-cache
      - name: Build and verify release variant using a disposable CI key
        working-directory: src/Client.Android
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/whitep-android-release-signing-smoke"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          trap 'rm -rf "$signing_dir"' EXIT
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          umask 077
          keytool -genkeypair -noprompt \
            -alias whitep-release-smoke \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -storetype JKS -keystore "$signing_dir/smoke.jks" \
            -storepass "$store_password" -keypass "$key_password" \
            -dname "CN=White-P Disposable CI Signing Smoke"
          export WHITEP_ANDROID_RELEASE_STORE_FILE="$signing_dir/smoke.jks"
          export WHITEP_ANDROID_RELEASE_STORE_PASSWORD="$store_password"
          export WHITEP_ANDROID_RELEASE_KEY_ALIAS="whitep-release-smoke"
          export WHITEP_ANDROID_RELEASE_KEY_PASSWORD="$key_password"
          gradle --no-daemon assembleRelease --no-build-cache
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/whitep-release-apksigner-smoke.txt"
          grep -Eq 'Signer #1 certificate SHA-256 digest: [0-9A-Fa-f]{64}' "$RUNNER_TEMP/whitep-release-apksigner-smoke.txt"
      - name: Remove disposable release-signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/whitep-android-release-signing-smoke"
      - name: Verify minimum permissions in merged Android APK
        shell: bash
        run: |
          set -euo pipefail
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$aapt2"
          python tools/verify_android_permissions.py \
            --apk src/Client.Android/app/build/outputs/apk/debug/app-debug.apk \
            --aapt2 "$aapt2"
      - name: Run Android JVM unit tests and generate coverage report
        working-directory: src/Client.Android
        env:
          WHITEP_INTEROP_SERVER_DLL: ${{ github.workspace }}/tests/HostLifecycle.Tests/bin/Release/net10.0/HostLifecycle.Tests.dll
        run: gradle --no-daemon testDebugUnitTest createDebugUnitTestCoverageReport
      - name: Configure KVM access for Android Keystore instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Remove temporary .NET fixture outputs before Android emulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/HostLifecycle.Tests/bin tests/HostLifecycle.Tests/obj
          df -h "$HOME"
      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            gradle --no-daemon --project-dir src/Client.Android connectedDebugAndroidTest createDebugAndroidTestCoverageReport
            adb install -r src/Client.Android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.whitep.client | grep -F 'package:'
            # The emulator runner invokes each script line in a separate shell; persist the resolved component in a file.
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.whitep.client | tr -d '\r' | grep -E '^com[.]whitep[.]client/.*MainActivity$' | tee /tmp/whitep-launcher-component.txt
            test -s /tmp/whitep-launcher-component.txt
            adb shell am force-stop com.whitep.client
            adb shell am start -n "$(cat /tmp/whitep-launcher-component.txt)"
            # The emulator runner executes each script line in a separate shell; keep each bounded retry loop on one line.
            i=0; app_pid=""; while [ "$i" -lt 30 ]; do app_pid="$(adb shell pidof com.whitep.client | tr -d '\r' || true)"; if [ -n "$app_pid" ]; then printf 'Android app PID: %s\n' "$app_pid"; break; fi; i=$((i+1)); sleep 1; done; if [ -z "$app_pid" ]; then echo "MainActivity process did not appear within 30 seconds; recent Android logcat follows."; adb logcat -d -t 300; exit 1; fi
            i=0; resumed_activity=""; while [ "$i" -lt 30 ]; do resumed_activity="$(adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F 'com.whitep.client' | grep -F 'MainActivity' || true)"; if [ -n "$resumed_activity" ]; then printf '%s\n' "$resumed_activity"; break; fi; i=$((i+1)); sleep 1; done; if [ -z "$resumed_activity" ]; then echo "MainActivity was not resumed within 30 seconds; recent Android logcat follows."; adb logcat -d -t 300; exit 1; fi
            echo "PASS: installed Android MainActivity launcher was resolved, launched, and verified with a live process and resumed activity."
            python tools/capture_android_brand_review.py
      - name: Upload Android brand review screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: whitep-brand-review-android
          path: artifacts/brand-review/android/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android Keystore instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitep-android-keystore-instrumentation-reports
          path: |
            src/Client.Android/app/build/reports/androidTests/connected/
            src/Client.Android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitep-android-unit-test-reports
          path: |
            src/Client.Android/app/build/reports/tests/testDebugUnitTest/
            src/Client.Android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify generated Protobuf Java and Kotlin sources
        working-directory: src/Client.Android
        shell: bash
        run: |
          set -euo pipefail
          generated_root="app/build/generated"
          test -d "$generated_root" || { echo "Protobuf generated-source directory is missing: $generated_root"; exit 1; }
          java_source="$(find "$generated_root" -type f -name '*.java' -print -quit)"
          kotlin_source="$(find "$generated_root" -type f -name '*.kt' -print -quit)"
          test -n "$java_source" || { echo "No generated Protobuf Java source found."; exit 1; }
          test -n "$kotlin_source" || { echo "No generated Protobuf Kotlin source found."; exit 1; }
          echo "Verified Java source: $java_source"
          echo "Verified Kotlin source: $kotlin_source"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: whitep-android-debug-apk
          path: src/Client.Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Validate Android coverage and critical test results
        shell: bash
        run: |
          set -euo pipefail
          python tests/validate_coverage_artifacts.py \
            --html-report src/Client.Android/app/build/reports/coverage/test/debug/index.html \
            --html-report src/Client.Android/app/build/reports/coverage/androidTest/debug/connected/index.html \
            --junit-dir src/Client.Android/app/build/test-results/testDebugUnitTest \
            --junit-dir src/Client.Android/app/build/outputs/androidTest-results/connected \
            --output artifacts/coverage/android-summary.json
      - name: Upload Android coverage reports and critical test summary
        uses: actions/upload-artifact@v4
        with:
          name: whitep-android-coverage-and-critical-results
          path: |
            src/Client.Android/app/build/reports/coverage/test/debug/index.html
            src/Client.Android/app/build/reports/coverage/androidTest/debug/connected/index.html
            artifacts/coverage/android-summary.json
          if-no-files-found: error
          retention-days: 7

  host-lifecycle-tests:
    name: Host lifecycle unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install pinned .NET code coverage collector
        run: |
          dotnet tool install --global dotnet-coverage --version 18.12.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install MsQuic runtime for QUIC fallback integration
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          rm /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install --yes libmsquic
      - name: Clean HostLifecycle test outputs
        run: dotnet clean tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release
      - name: Build HostLifecycle harness from clean outputs
        run: dotnet build tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release --no-incremental
      - name: Run documented HostLifecycle command from clean checkout
        run: dotnet run --project tests/HostLifecycle.Tests/HostLifecycle.Tests.csproj --configuration Release
      - name: Run HostLifecycle acceptance suite with code coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/coverage artifacts/critical-test-results
          dotnet-coverage collect \
            --include-files "tests/HostLifecycle.Tests/bin/Release/net10.0/*.dll" \
            --output artifacts/coverage/host-lifecycle.cobertura.xml \
            --output-format cobertura \
            dotnet tests/HostLifecycle.Tests/bin/Release/net10.0/HostLifecycle.Tests.dll \
            2>&1 | tee artifacts/critical-test-results/host-lifecycle.log
      - name: Validate HostLifecycle coverage and critical results
        run: |
          python tests/validate_coverage_artifacts.py \
            --cobertura artifacts/coverage/host-lifecycle.cobertura.xml \
            --critical-log artifacts/critical-test-results/host-lifecycle.log \
            --output artifacts/coverage/host-lifecycle-summary.json
      - name: Upload HostLifecycle coverage and critical results
        uses: actions/upload-artifact@v4
        with:
          name: whitep-host-lifecycle-coverage-and-critical-results
          path: |
            artifacts/coverage/host-lifecycle.cobertura.xml
            artifacts/coverage/host-lifecycle-summary.json
            artifacts/critical-test-results/host-lifecycle.log
          if-no-files-found: error
          retention-days: 7
