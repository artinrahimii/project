name: Rendezvous container build and smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    name: Build and exercise Rendezvous container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production container image
        run: docker build --file src/Rendezvous.Service/Dockerfile --tag whitep-rendezvous:${{ github.sha }} .

      - name: Start non-root container and exercise HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1:18080:8080 "whitep-rendezvous:${GITHUB_SHA}")"
          cleanup() {
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          container_uid="$(docker exec "$container_id" id -u)"
          test "$container_uid" != "0"
          python tests/rendezvous_container_smoke.py --base-url http://127.0.0.1:18080
