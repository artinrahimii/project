name: Android to Windows LAN acceptance

on:
  workflow_dispatch:
    inputs:
      host_bind_address:
        description: "Windows host RFC1918 IPv4 address on the same LAN as the Android device"
        required: true
        type: string
      host_port:
        description: "TCP port for the temporary test peer"
        required: true
        default: "43000"
        type: string

permissions:
  contents: read

jobs:
  android-windows-lan:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, whitep-lan]
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run real Android-to-Windows LAN acceptance
        shell: pwsh
        env:
          WHITEP_LAN_HOST_BIND_ADDRESS: ${{ inputs.host_bind_address }}
          WHITEP_LAN_HOST_PORT: ${{ inputs.host_port }}
        run: |
          $port = 0
          if (-not [int]::TryParse($env:WHITEP_LAN_HOST_PORT, [ref]$port)) {
            throw "host_port must be an integer."
          }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File "tests/HostLifecycle.Tests/Invoke-AndroidWindowsLanAcceptance.ps1" -HostBindAddress $env:WHITEP_LAN_HOST_BIND_ADDRESS -Port $port
          if ($LASTEXITCODE -ne 0) {
            throw "Android-to-Windows LAN acceptance failed."
          }

      - name: Upload redacted LAN acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitep-t0202-lan-acceptance
          path: step three/T0202/evidence/lan-acceptance.md
          if-no-files-found: warn
          retention-days: 14
