name: Android signed release

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  signed-release:
    name: Build and verify the production-signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android build packages
        shell: bash
        run: "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate protected secrets and restore the signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret in the protected android-release environment: $name"
              exit 1
            fi
          done
          echo "::add-mask::$ANDROID_RELEASE_STORE_PASSWORD"
          echo "::add-mask::$ANDROID_RELEASE_KEY_PASSWORD"
          signing_store="$RUNNER_TEMP/whitep-release-signing.jks"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          test -s "$signing_store"
          keytool -list -storetype JKS -keystore "$signing_store" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          chmod 600 "$signing_store"
      - name: Build the production-signed Android release APK
        working-directory: src/Client.Android
        env:
          WHITEP_ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/whitep-release-signing.jks
          WHITEP_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          WHITEP_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          WHITEP_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease --no-build-cache
      - name: Verify APK signature and pinned certificate fingerprint
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="src/Client.Android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          verify_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          actual="$(printf '%s\n' "$verify_output" | sed -n 's/^[[:space:]]*Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]] || { echo "Could not read a valid SHA-256 signer fingerprint from the APK."; exit 1; }
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "ANDROID_RELEASE_CERT_SHA256 must be a 64-character SHA-256 fingerprint."; exit 1; }
          [[ "$actual" == "$expected" ]] || { echo "Signed APK certificate fingerprint does not match the pinned GitHub Environment variable."; exit 1; }
          echo "PASS: release APK signature matches the pinned production certificate fingerprint."
      - name: Upload production-signed Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitep-android-release-signed
          path: src/Client.Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove production signing keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/whitep-release-signing.jks"
